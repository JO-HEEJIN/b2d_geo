name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          # 러너에 캐시된 옛 패치가 아니라 최신 1.26.x로 검사한다(govulncheck가 표준 라이브러리 취약점을 잡도록).
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false
